name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate required pages and local links
        shell: bash
        run: |
          test -f assets/styles.css
          test -f sitemap.xml
          for page in index.html releases.html docs.html extensions.html privacy.html security.html 404.html; do
            test -f "$page"
          done
          ! grep -R 'TODO\|PLACEHOLDER' --include='*.html' --include='*.css' .
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get("id"):
                      self.ids.add(values["id"])
                  if tag == "a" and values.get("href"):
                      self.hrefs.append(values["href"])

          root = Path(".")
          parsed = {}
          for page in root.glob("*.html"):
              links = Links()
              links.feed(page.read_text())
              parsed[page.name] = links

          failures = []
          for source, links in parsed.items():
              for href in links.hrefs:
                  if href.startswith(("https://", "http://", "mailto:")):
                      continue
                  path, _, fragment = href.partition("#")
                  target = "index.html" if path in ("", "/") else path.lstrip("/")
                  target_path = root / target
                  if not target_path.is_file():
                      failures.append(f"{source}: missing {href}")
                  elif fragment and target.endswith(".html") and fragment not in parsed[target].ids:
                      failures.append(f"{source}: missing fragment {href}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
